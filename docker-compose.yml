services:
  calculator:
    image: ${DOCKER_IMAGE:-calculator}:${IMAGE_TAG:-local}
    build: .
    environment:
      - PORT=8080
    networks:
      - calc-net
    restart: unless-stopped
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - calc-net
    restart: unless-stopped
    depends_on:
      calculator:
        condition: service_healthy

networks:
  calc-net:
    driver: bridge
